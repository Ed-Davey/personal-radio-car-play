name: Record native Codex review

on:
  pull_request_target:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open pull request number targeting dev
        required: true
        type: number

permissions: {}

concurrency:
  group: native-codex-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request }}

jobs:
  record:
    if: >-
      ${{ github.event_name == 'pull_request_target' ||
          (github.ref == 'refs/heads/dev' &&
           ((github.event_name == 'issue_comment' && github.event.issue.pull_request &&
             github.event.comment.user.id == 199175422) ||
            (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # For pull_request_target this SHA comes from the protected base branch.
      # Comment and manual events use dev. Never execute PR-head files here.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/github-script@v8
        with:
          script: |
            const { publishNativeReview } = require('./.github/scripts/native-codex-review.cjs');
            await publishNativeReview(github, context);
